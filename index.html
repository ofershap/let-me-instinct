<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Let Me Instinct That For You</title>
<meta name="description" content="במקום להסביר - תשלחו להם לינק. איציק כותב את ההודעה, וואטסאפ נפתח, וכל מה שנשאר זה ללחוץ שלח.">
<meta property="og:title" content="Let Me Instinct That For You">
<meta property="og:description" content="תנו לאיציק לענות בשבילכם. ההודעה מוכנה, וואטסאפ נפתח - רק נשאר ללחוץ שלח.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b141a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
  :root{
    --wa-green:#25d366; --wa-dark:#0b141a; --wa-panel:#111b21; --wa-input:#2a3942;
    --wa-text:#e9edef; --wa-text-dim:#8696a0; --wa-teal:#00a884;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--wa-dark);color:var(--wa-text);
    display:flex;flex-direction:column;min-height:100dvh;
  }
  header{
    padding:28px 20px 12px;text-align:center;
  }
  .logo{
    font-size:clamp(22px,5.5vw,34px);font-weight:800;letter-spacing:-.5px;direction:ltr;
  }
  .logo .instinct{color:var(--wa-green)}
  .tagline{color:var(--wa-text-dim);font-size:clamp(13px,3.5vw,16px);margin-top:6px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;width:100%;max-width:640px;margin:0 auto}

  /* WhatsApp mock */
  .phone{
    width:100%;max-width:420px;background:var(--wa-panel);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid #222e35;
  }
  .chat-head{
    display:flex;align-items:center;gap:10px;padding:12px 14px;background:#1f2c34;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--wa-teal);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
  }
  .chat-name{font-weight:600;font-size:15px;line-height:1.2}
  .chat-status{font-size:12px;color:var(--wa-text-dim)}
  .chat-status.typing{color:var(--wa-green)}
  .chat-body{
    min-height:190px;padding:18px 12px;display:flex;flex-direction:column;gap:8px;
    background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1.2' fill='%23203038'/%3E%3C/svg%3E");
  }
  .bubble{
    max-width:85%;padding:9px 12px;border-radius:10px;font-size:15px;line-height:1.45;
    white-space:pre-wrap;word-break:break-word;
  }
  .bubble.out{align-self:flex-start;background:#005c4b;border-top-left-radius:0}
  .bubble .time{display:block;font-size:11px;color:rgba(233,237,239,.6);text-align:left;margin-top:3px}
  .inputbar{
    display:flex;align-items:center;gap:8px;padding:10px;background:#1f2c34;
  }
  .inputbox{
    flex:1;background:var(--wa-input);border-radius:22px;padding:10px 14px;font-size:15px;
    min-height:42px;display:flex;align-items:center;color:var(--wa-text);word-break:break-word;
  }
  .inputbox .cursor{display:inline-block;width:2px;height:1.1em;background:var(--wa-green);
    margin-inline-start:1px;animation:blink 1s steps(1) infinite;vertical-align:text-bottom}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .inputbox .cursor{animation:none} .cta-wrap{transition:none} }
  .sendbtn{
    width:42px;height:42px;border-radius:50%;background:var(--wa-teal);border:none;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .sendbtn svg{width:20px;height:20px;fill:#fff;transform:scaleX(-1)}

  /* CTA */
  .cta-wrap{margin-top:26px;text-align:center;opacity:0;transform:translateY(8px);transition:all .5s ease;pointer-events:none}
  .cta-wrap.show{opacity:1;transform:none;pointer-events:auto}
  .cta{
    display:inline-flex;align-items:center;gap:10px;background:var(--wa-green);color:#06231a;
    font-weight:700;font-size:17px;padding:14px 26px;border-radius:30px;text-decoration:none;
    box-shadow:0 4px 20px rgba(37,211,102,.35);
  }
  .cta:hover{background:#2fe272}
  .hint{color:var(--wa-text-dim);font-size:13px;margin-top:10px}

  /* Generator (home) */
  .gen{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
  .gen textarea{
    width:100%;background:var(--wa-input);border:none;border-radius:14px;color:var(--wa-text);
    padding:14px 16px;font-size:16px;font-family:inherit;resize:vertical;min-height:90px;outline:none;
  }
  .gen textarea:focus{box-shadow:0 0 0 2px var(--wa-teal)}
  .gen button{
    background:var(--wa-teal);color:#fff;border:none;border-radius:14px;padding:14px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .gen button:hover{background:#00bd93}
  .linkout{
    display:none;background:var(--wa-panel);border:1px solid #2a3942;border-radius:14px;
    padding:14px;font-size:14px;word-break:break-all;direction:ltr;text-align:left;
  }
  .linkout.show{display:block}
  .copyrow{display:flex;gap:8px;margin-top:2px}
  .copybtn{flex:1;background:#2a3942!important;color:var(--wa-text)!important}
  .copied{color:var(--wa-green);font-size:13px;text-align:center;min-height:18px}
  footer{padding:18px;text-align:center;color:var(--wa-text-dim);font-size:12px}
  footer a{color:var(--wa-text-dim)}
  .makelink{margin-top:22px;font-size:14px}
  .makelink a{color:var(--wa-green);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo">Let Me <span class="instinct">Instinct</span> That For You</div>
  <div class="tagline">כי לפעמים קל יותר פשוט לתת לאיציק לענות 🤖</div>
</header>

<main id="main"></main>

<footer>
  נבנה בהשראת <span dir="ltr">Let Me Google That For You</span> · ההודעה נשלחת מכם, דרך הוואטסאפ שלכם
</footer>

<script>
(function(){
  var INSTINCT_NUMBER = "16508702892";
  var main = document.getElementById("main");
  var params = new URLSearchParams(location.search);
  var q = (params.get("q") || "").trim();

  function waUrl(text){
    return "https://wa.me/" + INSTINCT_NUMBER + "?text=" + encodeURIComponent(text);
  }

  if(!q){ renderGenerator(); } else { renderPlayer(q); }

  function renderGenerator(){
    main.innerHTML =
      '<div class="gen">' +
        '<textarea id="q" placeholder="מה שאלו אתכם ואין לכם כוח לענות?&#10;למשל: מה זה אינסטינקט ולמה כולם מדברים על זה?"></textarea>' +
        '<button id="make">צרו לינק לשיתוף</button>' +
        '<div class="copied" id="copied"></div>' +
        '<div class="linkout" id="out"></div>' +
        '<div class="copyrow" id="copyrow" style="display:none">' +
          '<button class="copybtn" id="copy">העתיקו את הלינק</button>' +
          '<button class="copybtn" id="open">פתחו תצוגה מקדימה</button>' +
        '</div>' +
      '</div>';
    var ta = document.getElementById("q"), out = document.getElementById("out"),
        copyrow = document.getElementById("copyrow"), copied = document.getElementById("copied");
    var link = "";
    document.getElementById("make").addEventListener("click", function(){
      var text = ta.value.trim();
      if(!text){ ta.focus(); return; }
      link = location.origin + location.pathname + "?q=" + encodeURIComponent(text);
      out.textContent = link;
      out.classList.add("show");
      copyrow.style.display = "flex";
      copied.textContent = "";
    });
    document.getElementById("copy").addEventListener("click", function(){
      if(!link) return;
      navigator.clipboard.writeText(link).then(function(){
        copied.textContent = "הועתק! עכשיו תשלחו למי ששאל 😏";
      }, function(){
        copied.textContent = "סמנו את הלינק והעתיקו ידנית";
      });
    });
    document.getElementById("open").addEventListener("click", function(){
      if(link) window.open(link, "_blank");
    });
  }

  function renderPlayer(message){
    main.innerHTML =
      '<div class="phone">' +
        '<div class="chat-head">' +
          '<div class="avatar">🤖</div>' +
          '<div><div class="chat-name">אינסטינקט</div>' +
          '<div class="chat-status" id="status">מחכה לכם…</div></div>' +
        '</div>' +
        '<div class="chat-body" id="body"></div>' +
        '<div class="inputbar">' +
          '<div class="inputbox" id="input"><span id="typed"></span><span class="cursor"></span></div>' +
          '<button class="sendbtn" aria-label="send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>' +
        '</div>' +
      '</div>' +
      '<div class="cta-wrap" id="ctaWrap">' +
        '<a class="cta" id="cta" target="_blank" rel="noopener" href="' + waUrl(message) + '">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="#06231a"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.8 1.9.8 2c.1.1.1.3 0 .5-.3.6-.7.9-.5 1.2.7 1.2 1.6 2 2.8 2.7.3.2.5.1.7-.1l1-1.1c.2-.3.4-.2.7-.1l2 .9c.3.2.5.3.6.4 0 .1 0 .7-.2 1.3z"/></svg>' +
          'פתחו וואטסאפ ושלחו לאינסטינקט' +
        '</a>' +
        '<div class="hint">ההודעה כבר כתובה - רק נשאר ללחוץ שלח ✌️</div>' +
        '<div class="makelink"><a href="' + location.pathname + '">רוצים להכין לינק כזה בעצמכם?</a></div>' +
      '</div>';

    var typed = document.getElementById("typed"),
        status = document.getElementById("status"),
        body = document.getElementById("body"),
        ctaWrap = document.getElementById("ctaWrap");

    // Typing animation into the mock input
    var i = 0;
    status.textContent = "מקלידים בשבילכם…";
    status.classList.add("typing");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var speed = reduceMotion ? 0 : Math.max(28, Math.min(70, 2400 / Math.max(message.length, 1)));
    function typeNext(){
      if(i < message.length){
        typed.textContent += message[i++];
        setTimeout(typeNext, speed + Math.random() * 30);
      } else {
        setTimeout(sendIt, reduceMotion ? 0 : 650);
      }
    }
    setTimeout(typeNext, reduceMotion ? 0 : 700);

    function sendIt(){
      // move the message into the chat as a sent bubble
      typed.textContent = "";
      status.classList.remove("typing");
      status.textContent = "מקוון";
      var b = document.createElement("div");
      b.className = "bubble out";
      var now = new Date();
      var hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
      b.textContent = message;
      var t = document.createElement("span");
      t.className = "time";
      t.textContent = hh + ":" + mm + " ✓✓";
      b.appendChild(t);
      body.appendChild(b);
      // then reveal the CTA that opens WhatsApp with the message pre-filled
      setTimeout(function(){
        ctaWrap.classList.add("show");
        // gentle auto-open attempt after the animation, like LMGTFY redirects to Google
        setTimeout(function(){
          location.href = waUrl(message);
        }, 1600);
      }, 500);
    }
  }
})();
</script>
</body>
</html>
